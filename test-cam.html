<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Test Webcam</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.js"></script>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; }
        h2 { margin: 20px; }
        #msg { margin: 20px; font-size: 18px; }
    </style>
</head>
<body>
    <h2>Test Webcam</h2>
    <div id="msg">Attendo che il browser chieda il permesso per la webcam...</div>
    <script>
        let video;
        function setup() {
            createCanvas(640, 480);
            video = createCapture(VIDEO);
            video.size(640, 480);
            video.hide();
            document.getElementById('msg').textContent = 'La webcam funziona! Stai vedendo il tuo video qui sotto.';
        }
        function draw() {
            background(40);
            if (video) image(video, 0, 0);
        }
    </script>
</body>
</html>
