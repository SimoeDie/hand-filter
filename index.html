<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Hand Filter - Finestra Magica</title>
    <script src="lib/p5.min.js"></script>
    <script src="lib/ml5.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        #shell {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: #000;
            display: flex;
            flex-direction: column;
            padding: 10px 10px 0;
        }
        #topBar {
            height: 40px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            flex-shrink: 0;
        }
        #filterName {
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.01em;
            opacity: 0;
        }
        #filterName.on { opacity: 1; }
        #view {
            flex: 1;
            min-height: 0;
            border-radius: 28px;
            overflow: hidden;
            position: relative;
            background: #141414;
        }
        #view canvas {
            display: block;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #bottomBar {
            height: 120px;
            flex-shrink: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #centerBtns {
            display: flex;
            align-items: center;
            gap: 22px;
        }
        #btnRec, #btnPhoto, #btnShare, #btnStart {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            cursor: pointer;
        }
        #btnRec {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            border: 3px solid #fff;
            background: #fff;
            color: #000;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
        }
        #btnRec.recording {
            background: #ff3b30;
            border-color: #ff3b30;
            color: #fff;
        }
        #btnPhoto {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            border: 4px solid #fff;
            background: #f4f4f4;
            box-shadow: inset 0 0 0 3px #000;
        }
        #btnPhoto:active { background: #ddd; }
        #btnShare {
            position: absolute;
            right: 22px;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border: none;
            background: transparent;
            color: #fff;
            padding: 0;
        }
        #btnShare svg { width: 28px; height: 28px; display: block; }
        #btnShare:disabled { opacity: 0.35; }

        #startOverlay {
            position: absolute;
            inset: 0;
            z-index: 6;
            background: #9bbc0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 18px 16px 22px;
        }
        #startOverlay::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(15, 56, 15, 0.12) 0 1px,
                transparent 1px 3px
            );
            z-index: 3;
        }
        #gbaLogo {
            position: relative;
            z-index: 2;
            width: min(72%, 420px);
            height: auto;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            flex-shrink: 0;
            margin-bottom: 4px;
        }
        .gba-sub {
            position: relative;
            z-index: 2;
            margin: 8px 0 4px;
            width: min(58%, 300px);
            height: auto;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            flex-shrink: 0;
        }
        #scenes {
            position: relative;
            z-index: 2;
            width: min(86%, 520px);
            height: min(52%, 300px);
            flex: 1;
            min-height: 140px;
        }
        .gba-press {
            position: relative;
            z-index: 2;
            font-family: "Courier New", Courier, ui-monospace, monospace;
            font-size: 11px;
            letter-spacing: 0.28em;
            color: #0f380f;
            text-align: center;
            animation: blinkStart 1.2s steps(2, end) infinite;
            flex-shrink: 0;
        }
        #btnStart {
            position: relative;
            z-index: 2;
            transform: none;
            background: #0f380f;
            color: #9bbc0f;
            border: 3px solid #0f380f;
            padding: 10px 28px;
            border-radius: 4px;
            font-family: "Courier New", Courier, ui-monospace, monospace;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            box-shadow: 3px 3px 0 #306230;
            flex-shrink: 0;
        }
        #btnStart:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #306230;
        }
        .scene {
            position: absolute;
            inset: 0;
        }
        .scene.a {
            opacity: 1;
            animation: sceneA 5.2s steps(4, end) infinite;
        }
        .scene.b {
            opacity: 0;
            animation: sceneB 5.2s steps(4, end) infinite;
        }
        @keyframes sceneA {
            0%, 42% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        @keyframes sceneB {
            0%, 48% { opacity: 0; }
            56%, 92% { opacity: 1; }
            100% { opacity: 0; }
        }
        .hands-row {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
        }
        .hand {
            width: 118px;
            height: auto;
            overflow: visible;
            position: relative;
        }
        .hand img, .pinch-hand img {
            width: 100%;
            height: auto;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .hand.left img { transform: scaleX(-1); }
        .pinch-hand {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 148px;
            transform: translate(-50%, -54%);
            overflow: visible;
        }
        .pix {
            position: absolute;
            width: 16px;
            height: 16px;
            pointer-events: none;
        }
        .pix.thumb-tip {
            left: 18%;
            top: 46%;
            background: #c42b2b;
            animation: pinchThumb 1.4s steps(3, end) infinite;
        }
        .pix.pinky-tip {
            left: 74%;
            top: 30%;
            background: #2458c4;
            animation: pinchPinky 1.4s steps(3, end) infinite;
        }
        @keyframes pinchThumb {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(10px, 4px); }
        }
        @keyframes pinchPinky {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-12px, 6px); }
        }
        .scene.a .hand.left { animation: spreadL 2.6s steps(3, end) infinite; }
        .scene.a .hand.right { animation: spreadR 2.6s steps(3, end) infinite; }
        @keyframes spreadL {
            0%, 100% { transform: translateX(22px); }
            50% { transform: translateX(0); }
        }
        @keyframes spreadR {
            0%, 100% { transform: translateX(-22px); }
            50% { transform: translateX(0); }
        }
        .dash-rect {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 38%;
            height: 52%;
            transform: translate(-50%, -50%) scale(0.55);
            border: 3px dashed #0f380f;
            border-radius: 2px;
            opacity: 0.35;
            animation: dashGrow 2.6s steps(4, end) infinite;
        }
        @keyframes dashGrow {
            0%, 12% { opacity: 0.25; transform: translate(-50%, -50%) scale(0.5); }
            45%, 70% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0.2; transform: translate(-50%, -50%) scale(1.05); }
        }
        .tap-ring {
            position: absolute;
            left: 50%;
            top: 48%;
            width: 22px;
            height: 22px;
            margin-left: -11px;
            border: 3px solid #0f380f;
            border-radius: 0;
            opacity: 0;
            animation: tapPulse 2.6s steps(3, end) infinite;
        }
        .tap-ring.two { animation-delay: 0.85s; }
        @keyframes tapPulse {
            0%, 18% { opacity: 0; transform: scale(0.4); }
            28% { opacity: 1; transform: scale(1); }
            55%, 100% { opacity: 0; transform: scale(1.8); }
        }
        @keyframes blinkStart {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        #busy {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
            background: rgba(0,0,0,0.72);
            z-index: 8;
            padding: 20px;
            text-align: center;
        }
        #busy.show { display: flex; }
        #busy .spin {
            display: inline-block;
            width: 18px; height: 18px;
            border: 3px solid #888;
            border-top-color: #fff;
            border-radius: 50%;
            animation: rot 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
            flex-shrink: 0;
        }
        @keyframes rot { to { transform: rotate(360deg); } }
        #errBox {
            position: fixed;
            bottom: 130px;
            left: 20px;
            right: 20px;
            color: #ff6b6b;
            font-family: ui-monospace, Consolas, monospace;
            font-size: 13px;
            background: rgba(0,0,0,0.9);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #ff4444;
            white-space: pre-wrap;
            z-index: 20;
            display: none;
        }
    </style>
</head>
<body>
    <div id="shell">
        <div id="topBar"><span id="filterName"></span></div>
        <div id="view">
            <div id="startOverlay">
                    <img id="gbaLogo" src="workshok-logo-px.png?v=27" alt="workshok">
                        <div id="scenes">
                    <div class="scene a">
                        <div class="dash-rect"></div>
                        <div class="hands-row">
                            <div class="hand left"><img src="hand-cursor.png?v=25" alt=""></div>
                            <div class="hand right"><img src="hand-cursor.png?v=25" alt=""></div>
                        </div>
                    </div>
                    <div class="scene b">
                        <div class="pinch-hand">
                            <img src="hand-cursor.png?v=25" alt="">
                            <span class="pix thumb-tip"></span>
                            <span class="pix pinky-tip"></span>
                        </div>
                        <div class="tap-ring"></div>
                        <div class="tap-ring two"></div>
                    </div>
                        </div>
                        <img class="gba-sub" src="glitch-your-face.png?v=27" alt="glitch your face">
                        <div class="gba-press">PRESS START</div>
                    <button id="btnStart" type="button">Avvia</button>
            </div>
            <div id="busy"><span class="spin"></span><span id="busyText">Caricamento...</span></div>
        </div>
        <div id="bottomBar">
            <div id="centerBtns">
                <button id="btnRec" type="button" disabled>REC</button>
                <button id="btnPhoto" type="button" disabled aria-label="Foto"></button>
            </div>
            <button id="btnShare" type="button" disabled aria-label="Condividi">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 4v10"/>
                    <path d="M8 8l4-4 4 4"/>
                    <path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/>
                </svg>
            </button>
        </div>
    </div>
    <div id="errBox"></div>
    <script src="friend-cutout.js?v=27"></script>
    <script src="gesture-tap.js?v=27"></script>
    <script src="sketch.js?v=27"></script>
</body>
</html>
