<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Filter - Finestra Magica</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">
    <link rel="icon" href="icon.png" type="image/png">
    <script src="lib/p5.min.js"></script>
    <script src="lib/ml5.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }
        canvas { display: block; }
        #busy {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 18px;
            background: rgba(0,0,0,0.85);
            padding: 20px 30px;
            border-radius: 10px;
            border: 1px solid #333;
            z-index: 10;
        }
        #busy .spin {
            display: inline-block;
            width: 18px; height: 18px;
            border: 3px solid #888;
            border-top-color: #fff;
            border-radius: 50%;
            animation: rot 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }
        @keyframes rot { to { transform: rotate(360deg); } }
        #installBtn {
            position: fixed;
            top: 16px;
            right: 16px;
            background: #28c76f;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            z-index: 30;
            box-shadow: 0 4px 14px rgba(0,0,0,0.4);
        }
        #installBtn:hover { background: #1fb25f; }
        #recordBtn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #e5484d;
            color: #fff;
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            z-index: 30;
            box-shadow: 0 4px 14px rgba(0,0,0,0.5);
            border: 4px solid rgba(255,255,255,0.85);
        }
        #recordBtn.rec { background: #7a1013; }
        #recordBtn:hover { background: #c13338; }
        #recordBtn.rec:hover { background: #5c0c0e; }
        #errBox {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            color: #ff6b6b;
            font-family: Consolas, monospace;
            font-size: 13px;
            background: rgba(0,0,0,0.9);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #ff4444;
            white-space: pre-wrap;
            z-index: 20;
            display: none;
        }
    </style>
</head>
<body>
    <div id="busy"><span class="spin"></span><span id="busyText">Caricamento...</span></div>
    <div id="errBox"></div>
    <button id="installBtn">Installa App</button>
    <button id="recordBtn">REC</button>
    <script src="sketch.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((err) => console.error('SW register failed:', err));
            });
        }

        let deferredPrompt = null;
        const installBtn = document.getElementById('installBtn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });
        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            await deferredPrompt.userChoice;
            deferredPrompt = null;
            installBtn.style.display = 'none';
        });
        window.addEventListener('appinstalled', () => {
            deferredPrompt = null;
            installBtn.style.display = 'none';
        });
    </script>
</body>
</html>
